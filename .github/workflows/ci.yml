name: CI

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

# Read-only token: nothing here pushes, comments or releases.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.12', '3.13']

    steps:
    - name: Checkout code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Install uv
      uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      with:
        enable-cache: true

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Install dependencies
      run: uv sync

    - name: Run integration tests
      run: uv run pytest tests/integration tests/unit -v --tb=short
      timeout-minutes: 5

    - name: Test summary
      if: always()
      run: |
        echo "Tests completed for Python ${{ matrix.python-version }}"
        if [ $? -eq 0 ]; then
          echo "✅ All tests passed"
        else
          echo "❌ Some tests failed"
        fi

  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Install uv
      uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

    - name: Audit locked dependencies for known vulnerabilities
      # Exports exactly what uv.lock pins for the runtime (with hashes, without
      # this project) and fails on any known vulnerability. An ignored advisory
      # needs a comment here with its reason and risk ID.
      run: |
        uv export --frozen --no-dev --no-emit-project > "$RUNNER_TEMP/requirements-audit.txt"
        uvx pip-audit==2.10.1 -r "$RUNNER_TEMP/requirements-audit.txt" --require-hashes --disable-pip --strict
